<template>
    <lightning-card title="Find you Books Here...">

        <lightning-layout class="slds-p-around_medium">
            <lightning-layout-item size='8'>
                <lightning-input label="Enter book name" onchange={handleChange}></lightning-input>
            </lightning-layout-item>

            <lightning-layout-item class="slds-m-top_large slds-m-left_medium">
                <lightning-button label="Search" onclick={handleSearchClick}></lightning-button>
            </lightning-layout-item>
        </lightning-layout>

    </lightning-card>

    <lightning-card>
        <!-- <template if:false={hasBooks}> -->
        <font size="6">{showText}</font>
        <!-- </template> -->

        <template if:true={isLoading}>
            <lightning-spinner
            alternative-text="Loading..."
            >
            </lightning-spinner>
        </template>

        <lightning-layout multiple-rows>
            <template for:each={books} for:item="book">
                <lightning-layout-item key={book.id} size="3" class="slds-p-around_medium" style="border-style: groove;">
                    <img src={book.fullImageUrl} alt="No Image found" style="height:300px; width:90%">
                   <br> Book Name: {book.name}
                    <br> Author: {book.author}
                    <br> Image url :{book.fullImageUrl}

                </lightning-layout-item>
            </template>
        </lightning-layout>
        <!-- </template> -->
    </lightning-card>
</template>
